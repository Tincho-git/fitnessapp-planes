services:
  postgres:
    image: postgres:16-alpine
    container_name: fitnessapp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-fitness_app_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-210405}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-fitness_app_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: fitnessapp_postgres_data
