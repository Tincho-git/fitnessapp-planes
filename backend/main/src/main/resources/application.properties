spring.config.import=optional:file:./.env[.properties]
# ============================================================
#  Datasource - PostgreSQL
# ============================================================
spring.application.name=fitnessapp-planes
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fitness_app_db}}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# ============================================================
#  JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# El dialecto se detecta automáticamente; no hace falta especificarlo
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================================
#  Open-in-view (deshabilitar para evitar warning)
# ============================================================
spring.jpa.open-in-view=false

# ============================================================
#  JWT
# ============================================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ============================================================
#  Cloudinary Configuration
# ============================================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ============================================================
#  Multipart File Upload Config
# ============================================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Database migrations / operations
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
management.endpoints.web.exposure.include=health,info

# Application
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap-admin.nombre=${BOOTSTRAP_ADMIN_NAME:Administrador}

