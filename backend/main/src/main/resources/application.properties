# ============================================================
#  Datasource - PostgreSQL
# ============================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fitness_app_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:210405}

# ============================================================
#  JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# El dialecto se detecta automáticamente; no hace falta especificarlo
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================================
#  Open-in-view (deshabilitar para evitar warning)
# ============================================================
spring.jpa.open-in-view=false

# ============================================================
#  JWT
# ============================================================
jwt.secret=${JWT_SECRET:miClaveSecretaSuperSegura123456}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ============================================================
